<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Break Timer</title>
  
  <script type="application/json" id="module-config">
  {
    "id": "timer",
    "name": "Break Timer",
    "type": "Modul",
    "priority": 5,
    "borderColor": "#1a3a52",
    "activeColor": "#00BCD4",
    "hasControllerUI": true,
    "hasOverlay": true,
    "overlayUrl": "/modules/countdown.html",
    "dependencies": []
  }
  </script>

  <!-- ==========================================
       SERVER MODULE CODE
       ========================================== -->
  <script type="text/x-server-module">
if (!moduleStates.timer) {
  moduleStates.timer = {
    duration: 0,
    startTime: null,
    pausedAt: null,
    pausedRemaining: 0,
    isRunning: false,
    isPaused: false,
    wasSkipped: false,
    language: 'en',
    musicConnected: false,
    _preFadeVolume: 50
  };
}

const timerState = moduleStates.timer;

function getTimerRemaining() {
  if (!timerState.isRunning) return 0;
  if (timerState.isPaused) return timerState.pausedRemaining;
  const elapsed = Math.floor((Date.now() - timerState.startTime) / 1000);
  return Math.max(0, timerState.duration - elapsed);
}

function getTimerEndTime() {
  if (!timerState.isRunning || timerState.isPaused) return null;
  return timerState.startTime + (timerState.duration * 1000);
}

function triggerSpotifyFade(fromVol, toVol) {
  if (!moduleStates.spotify) return;
  moduleStates.spotify.previousVolume = fromVol;
  moduleStates.spotify.targetVolume   = toVol;
  moduleStates.spotify.fadeStartTime  = Date.now();
  moduleStates.spotify.fadeDirection  = 'fade';
  console.log('[TIMER] Spotify fade: ' + fromVol + '% -> ' + toVol + '%');
}

app.get('/api/timer', getUserFromSession, function(req, res) {
  res.json({
    duration:       timerState.duration,
    remaining:      getTimerRemaining(),
    endTime:        getTimerEndTime(),
    isRunning:      timerState.isRunning,
    isPaused:       timerState.isPaused,
    wasSkipped:     timerState.wasSkipped,
    language:       timerState.language,
    musicConnected: timerState.musicConnected
  });
});

app.get('/api/timer/public', function(req, res) {
  res.json({
    duration:   timerState.duration,
    remaining:  getTimerRemaining(),
    endTime:    getTimerEndTime(),
    isRunning:  timerState.isRunning,
    isPaused:   timerState.isPaused,
    wasSkipped: timerState.wasSkipped,
    language:   timerState.language
  });
});

app.post('/api/timer/start', getUserFromSession, function(req, res) {
  const minutes = req.body.minutes;
  if (!minutes || minutes <= 0) return res.status(400).json({ error: 'Invalid minutes' });

  timerState.duration        = minutes * 60;
  timerState.startTime       = Date.now();
  timerState.pausedAt        = null;
  timerState.pausedRemaining = 0;
  timerState.isRunning       = true;
  timerState.isPaused        = false;
  timerState.wasSkipped      = false;

  console.log('[TIMER] Started: ' + minutes + ' min');

  if (timerState.musicConnected && moduleStates.spotify) {
    const currentVol = moduleStates.spotify.volume || 50;
    timerState._preFadeVolume = currentVol;
    triggerSpotifyFade(currentVol, 80);
  }

  res.json({
    duration:  timerState.duration,
    remaining: getTimerRemaining(),
    endTime:   getTimerEndTime(),
    isRunning: true,
    isPaused:  false,
    wasSkipped: false
  });
});

app.post('/api/timer/pause', getUserFromSession, function(req, res) {
  if (!timerState.isRunning) return res.status(400).json({ error: 'Timer not running' });
  if (timerState.isPaused)   return res.status(400).json({ error: 'Already paused' });

  timerState.pausedRemaining = getTimerRemaining();
  timerState.pausedAt        = Date.now();
  timerState.isPaused        = true;

  res.json({
    duration:  timerState.duration,
    remaining: timerState.pausedRemaining,
    endTime:   null,
    isRunning: true,
    isPaused:  true,
    wasSkipped: false
  });
});

app.post('/api/timer/resume', getUserFromSession, function(req, res) {
  if (!timerState.isRunning) return res.status(400).json({ error: 'Timer not running' });
  if (!timerState.isPaused)  return res.status(400).json({ error: 'Not paused' });

  timerState.duration  = timerState.pausedRemaining;
  timerState.startTime = Date.now();
  timerState.pausedAt  = null;
  timerState.isPaused  = false;

  res.json({
    duration:  timerState.duration,
    remaining: getTimerRemaining(),
    endTime:   getTimerEndTime(),
    isRunning: true,
    isPaused:  false,
    wasSkipped: false
  });
});

app.post('/api/timer/reset', getUserFromSession, function(req, res) {
  const wasRunning = timerState.isRunning && getTimerRemaining() > 0;

  if (timerState.musicConnected && moduleStates.spotify) {
    const restoreVol = timerState._preFadeVolume || 50;
    const currentVol = moduleStates.spotify.volume || 80;
    triggerSpotifyFade(currentVol, restoreVol);
  }

  timerState.duration        = 0;
  timerState.startTime       = null;
  timerState.pausedAt        = null;
  timerState.pausedRemaining = 0;
  timerState.isRunning       = false;
  timerState.isPaused        = false;
  timerState.wasSkipped      = wasRunning;

  res.json({ duration: 0, remaining: 0, endTime: null, isRunning: false, isPaused: false, wasSkipped: wasRunning, language: timerState.language });
});

app.post('/api/timer/language', getUserFromSession, function(req, res) {
  const language = req.body.language;
  if (language !== 'de' && language !== 'en') return res.status(400).json({ error: 'Invalid language' });
  timerState.language = language;
  res.json({ language: timerState.language });
});

app.post('/api/timer/music-connect', getUserFromSession, function(req, res) {
  const connected = req.body.connected;
  timerState.musicConnected = connected;
  console.log('[TIMER] Music connection: ' + (connected ? 'ON' : 'OFF'));
  res.json({ musicConnected: timerState.musicConnected });
});

// Auto-detect natural timer end → restore volume
setInterval(function() {
  if (timerState.isRunning && !timerState.isPaused) {
    const remaining = getTimerRemaining();
    if (remaining === 0 && timerState.duration > 0) {
      if (timerState.musicConnected && moduleStates.spotify) {
        const restoreVol = timerState._preFadeVolume || 50;
        const currentVol = moduleStates.spotify.volume || 80;
        if (moduleStates.spotify.targetVolume !== restoreVol) {
          triggerSpotifyFade(currentVol, restoreVol);
          console.log('[TIMER] Timer ended, restoring volume to ' + restoreVol + '%');
        }
      }
      timerState.isRunning = false;
    }
  }
}, 500);
  </script>

  <!-- ==========================================
       CONTROLLER MODULE CODE
       ========================================== -->
  <script type="text/x-controller-module">
var timerInterval    = null;
var isUpdating       = false;
var spotifyConnected = false;
var vidsAvailable    = false;
var currentMode      = 'music';  // 'music' or 'vids'
var modeEnabled      = false;    // checkbox state
var lastSpotifyCheck = 0;

// ── Module / Spotify check ────────────────────────────────────────────

async function checkModules() {
  try {
    var modRes  = await fetch(apiUrl + '/api/modules/list');
    var modData = await modRes.json();
    vidsAvailable = modData.modules.some(function(m) { return m.id === 'entertaining-countdown'; });
  } catch(e) { vidsAvailable = false; }

  await refreshSpotifyStatus();

  // Default mode selection
  if (spotifyConnected) { currentMode = 'music'; }
  else if (vidsAvailable) { currentMode = 'vids'; }
  else { currentMode = 'music'; }

  renderPill();
}

async function refreshSpotifyStatus() {
  try {
    var spRes = await fetch(apiUrl + '/api/spotify/state', { headers: getHeaders() });
    if (!spRes.ok) { spotifyConnected = false; return; }
    var spData = await spRes.json();
    spotifyConnected = spData.connected === true;
  } catch(e) { spotifyConnected = false; }
}

// ── Render pill + checkbox ────────────────────────────────────────────

function renderPill() {
  var section = document.getElementById('timer-control-section');
  if (!section) return;

  var musicDisabled = !spotifyConnected;
  var vidsDisabled  = !vidsAvailable;
  var bothDisabled  = musicDisabled && vidsDisabled;

  section.innerHTML =
    '<style>' +
      '.mode-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1a1a;border-radius:8px;margin-bottom:15px;}' +
      '.pill-wrap{display:flex;align-items:center;gap:8px;flex:1;}' +
      '.pill-label{font-size:13px;font-weight:bold;transition:color 0.3s;user-select:none;min-width:50px;text-align:center;}' +
      '.pill-label.active{color:#fff;cursor:pointer;}' +
      '.pill-label.inactive{color:#777;cursor:pointer;}' +
      '.pill-label.disabled{color:#333;cursor:not-allowed;}' +
      '.pill-track{position:relative;width:50px;height:26px;background:#2a2a2a;border:2px solid #444;border-radius:13px;cursor:pointer;flex-shrink:0;}' +
      '.pill-track.all-disabled{opacity:0.3;cursor:not-allowed;}' +
      '.pill-circle{position:absolute;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left 0.35s cubic-bezier(0.4,0,0.2,1);box-shadow:0 2px 5px rgba(0,0,0,0.4);}' +
      '.pill-circle.pos-left{left:2px;}' +
      '.pill-circle.pos-center{left:14px;}' +
      '.pill-circle.pos-right{left:26px;}' +
      '.mode-divider{width:1px;height:20px;background:#444;flex-shrink:0;}' +
      '.mode-checkbox-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}' +
      '.mode-checkbox-wrap input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#00BCD4;}' +
      '.mode-checkbox-wrap label{font-size:12px;color:#aaa;cursor:pointer;user-select:none;white-space:nowrap;}' +
    '</style>' +
    '<div class="mode-row">' +
      '<div class="pill-wrap">' +
        '<span class="pill-label ' + (musicDisabled ? 'disabled' : (currentMode==='music' ? 'active' : 'inactive')) + '" id="pill-lbl-music">🎵 Musik</span>' +
        '<div class="pill-track' + (bothDisabled ? ' all-disabled' : '') + '" id="pill-track">' +
          '<div class="pill-circle ' + (currentMode==='music' ? 'pos-left' : 'pos-right') + '" id="pill-circle"></div>' +
        '</div>' +
        '<span class="pill-label ' + (vidsDisabled ? 'disabled' : (currentMode==='vids' ? 'active' : 'inactive')) + '" id="pill-lbl-vids">🎬 Vids</span>' +
      '</div>' +
      '<div class="mode-divider"></div>' +
      '<div class="mode-checkbox-wrap">' +
        '<input type="checkbox" id="mode-enable-cb"' + (modeEnabled ? ' checked' : '') + (bothDisabled ? ' disabled' : '') + '>' +
        '<label for="mode-enable-cb">Aktiv</label>' +
      '</div>' +
    '</div>';

  if (!bothDisabled) {
    document.getElementById('pill-track').addEventListener('click', onPillClick);
    document.getElementById('pill-lbl-music').addEventListener('click', function() {
      if (!musicDisabled) trySetMode('music'); else bouncePill('pos-left');
    });
    document.getElementById('pill-lbl-vids').addEventListener('click', function() {
      if (!vidsDisabled) trySetMode('vids'); else bouncePill('pos-right');
    });
    var cb = document.getElementById('mode-enable-cb');
    cb.addEventListener('change', function() {
      modeEnabled = cb.checked;
      applyMode();
    });
  }
}

// ── Pill interaction ──────────────────────────────────────────────────

function onPillClick() {
  var target = currentMode === 'music' ? 'vids' : 'music';
  trySetMode(target);
}

function trySetMode(target) {
  if (target === 'music' && !spotifyConnected) { bouncePill('pos-left');  return; }
  if (target === 'vids'  && !vidsAvailable)    { bouncePill('pos-right'); return; }
  if (target === currentMode) return;
  currentMode = target;
  applyMode();
  renderPill();
}

function bouncePill(returnPos) {
  var circle = document.getElementById('pill-circle');
  if (!circle) return;
  circle.className = 'pill-circle pos-center';
  setTimeout(function() { circle.className = 'pill-circle ' + returnPos; }, 380);
}

async function applyMode() {
  try {
    if (!modeEnabled) {
      // Checkbox off → disconnect everything
      await fetch(apiUrl + '/api/timer/music-connect', { method:'POST', headers:getHeaders(), body:JSON.stringify({ connected: false }) });
      if (vidsAvailable) await fetch(apiUrl + '/api/entertaining/state', { method:'POST', headers:getHeaders(), body:JSON.stringify({ enabled: false }) });
      return;
    }
    if (currentMode === 'music') {
      await fetch(apiUrl + '/api/timer/music-connect', { method:'POST', headers:getHeaders(), body:JSON.stringify({ connected: true }) });
      if (vidsAvailable) await fetch(apiUrl + '/api/entertaining/state', { method:'POST', headers:getHeaders(), body:JSON.stringify({ enabled: false }) });
    } else {
      await fetch(apiUrl + '/api/timer/music-connect', { method:'POST', headers:getHeaders(), body:JSON.stringify({ connected: false }) });
      if (vidsAvailable) await fetch(apiUrl + '/api/entertaining/state', { method:'POST', headers:getHeaders(), body:JSON.stringify({ enabled: true }) });
    }
  } catch(e) { console.error('[TIMER] applyMode error:', e); }
}

// ── Timer UI ──────────────────────────────────────────────────────────

container.innerHTML =
  '<style>' +
    '.timer-preview{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:20px;text-align:center;}' +
    '.timer-preview-time{font-size:28px;font-weight:bold;margin-bottom:8px;}' +
    '.timer-preview-end{font-size:14px;opacity:0.7;}' +
    '.timer-input-group{margin-bottom:15px;}' +
    '.timer-input-group label{display:block;margin-bottom:6px;font-size:13px;opacity:0.8;}' +
    '.timer-input-group input{width:100%;padding:10px;background:#1a1a1a;border:2px solid #3a3a3a;border-radius:8px;color:white;font-size:15px;transition:border-color 0.3s;}' +
    '.timer-input-group input:focus{outline:none;border-color:#00BCD4;}' +
    '.timer-button-group{display:flex;gap:8px;margin-top:15px;}' +
    '.timer-button-group button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all 0.3s;}' +
    '.timer-btn-start{background:#4CAF50;color:white;}.timer-btn-start:hover{background:#45a049;}' +
    '.timer-btn-pause{background:#FF9800;color:white;}.timer-btn-pause:hover{background:#e68900;}' +
    '.timer-btn-reset{background:#f44336;color:white;}.timer-btn-reset:hover{background:#da190b;}' +
    '.hidden{display:none!important;}' +
  '</style>' +
  '<div class="timer-preview">' +
    '<div class="timer-preview-time" id="timer-preview-time">00:00</div>' +
    '<div class="timer-preview-end"  id="timer-preview-end">Resume: --:--</div>' +
  '</div>' +
  '<div class="timer-input-group">' +
    '<label for="timer-time-input">Time in minutes:</label>' +
    '<input type="number" id="timer-time-input" min="1" placeholder="e.g. 5" value="5">' +
  '</div>' +
  '<div id="timer-control-section"></div>' +
  '<div class="timer-button-group">' +
    '<button class="timer-btn-start" id="timer-start-btn">▶️ Start</button>' +
    '<button class="timer-btn-pause hidden" id="timer-pause-btn">⏸️ Pause</button>' +
    '<button class="timer-btn-reset hidden" id="timer-reset-btn">⏹️ Reset</button>' +
  '</div>';

var previewTime = document.getElementById('timer-preview-time');
var previewEnd  = document.getElementById('timer-preview-end');
var timeInput   = document.getElementById('timer-time-input');
var startBtn    = document.getElementById('timer-start-btn');
var pauseBtn    = document.getElementById('timer-pause-btn');
var resetBtn    = document.getElementById('timer-reset-btn');

async function updateTimerUI() {
  if (isUpdating) return;
  try {
    var res   = await fetch(apiUrl + '/api/timer', { headers: getHeaders() });
    var timer = await res.json();

    // Spotify re-check every 10s
    if (Date.now() - lastSpotifyCheck > 10000) {
      lastSpotifyCheck = Date.now();
      var wasConnected = spotifyConnected;
      await refreshSpotifyStatus();
      if (wasConnected !== spotifyConnected) renderPill();
    }

    if (timer.isRunning && timer.remaining > 0) {
      var mins = Math.floor(timer.remaining / 60);
      var secs = timer.remaining % 60;
      previewTime.textContent = (mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;
      if (timer.endTime && !timer.isPaused) {
        var d = new Date(timer.endTime);
        previewEnd.textContent = 'Resume: '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
      } else { previewEnd.textContent = 'Paused'; }
      panel.style.borderColor = moduleConfig.activeColor;
      startBtn.classList.add('hidden');
      pauseBtn.classList.remove('hidden');
      resetBtn.classList.remove('hidden');
      pauseBtn.textContent = timer.isPaused ? '▶️ Resume' : '⏸️ Pause';
    } else {
      previewTime.textContent = '00:00';
      previewEnd.textContent  = 'Resume: --:--';
      panel.style.borderColor = moduleConfig.borderColor;
      startBtn.classList.remove('hidden');
      pauseBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
    }
  } catch(e) { console.error('[TIMER] updateTimerUI error:', e); }
}

startBtn.addEventListener('click', async function() {
  isUpdating = true;
  var minutes = parseInt(timeInput.value) || 5;
  try {
    await fetch(apiUrl + '/api/timer/start', { method:'POST', headers:getHeaders(), body:JSON.stringify({ minutes: minutes }) });
    await updateTimerUI();
  } catch(e) { console.error('[TIMER] Start error:', e); }
  finally { isUpdating = false; }
});

pauseBtn.addEventListener('click', async function() {
  isUpdating = true;
  try {
    var res   = await fetch(apiUrl + '/api/timer', { headers: getHeaders() });
    var state = await res.json();
    var ep    = state.isPaused ? '/api/timer/resume' : '/api/timer/pause';
    await fetch(apiUrl + ep, { method:'POST', headers:getHeaders() });
    await updateTimerUI();
  } catch(e) { console.error('[TIMER] Pause error:', e); }
  finally { isUpdating = false; }
});

resetBtn.addEventListener('click', async function() {
  isUpdating = true;
  try {
    await fetch(apiUrl + '/api/timer/reset', { method:'POST', headers:getHeaders() });
    await updateTimerUI();
  } catch(e) { console.error('[TIMER] Reset error:', e); }
  finally { isUpdating = false; }
});

checkModules();
timerInterval = setInterval(updateTimerUI, 1000);
updateTimerUI();

return { destroy: function() { if (timerInterval) clearInterval(timerInterval); } };
</script>

<body>
  <video id="entertainment-video" class="hidden"></video>

  <div class="countdown-container large" id="countdownContainer">
    <div style="text-align:center;">
      <div class="countdown-time" id="countdownTime">00:00</div>
      <div class="countdown-message hidden" id="countdownMessage">Stream continues shortly</div>
      <div class="countdown-bar">
        <div class="countdown-bar-fill" id="countdownBar"></div>
      </div>
      <div class="countdown-end" id="countdownEnd">Around --:--</div>
      <div class="countdown-skipped hidden" id="countdownSkipped">Break was skipped</div>
    </div>
  </div>

  <script>
    window.API_URL = window.location.origin;

    const countdownContainer = document.getElementById('countdownContainer');
    const timeEl    = document.getElementById('countdownTime');
    const barEl     = document.getElementById('countdownBar');
    const endEl     = document.getElementById('countdownEnd');
    const messageEl = document.getElementById('countdownMessage');
    const skippedEl = document.getElementById('countdownSkipped');
    const videoEl   = document.getElementById('entertainment-video');

    const texts = {
      de: { around: 'Ungefähr um', clock: 'Uhr', skipped: 'Pause wurde übersprungen', starting: 'Stream setzt gleich fort' },
      en: { around: 'Around',      clock: '',     skipped: 'Break was skipped',        starting: 'Stream continues shortly' }
    };

    let currentLang          = 'en';
    let messageShownAt       = null;
    let skippedShownAt       = null;
    let entertainmentEnabled = false;
    let lastTimerRemaining   = 0;
    let currentTimerState    = null;

    let videoDurations    = new Map();
    let availableVideos   = [];
    let currentPlaylist   = [];
    let currentVideoIndex = 0;
    let entertainmentActive   = false;
    let timerStartTime        = 0;
    let videoTransitioning    = false;

    window.entertainmentTimerControl = {
      makeTimerLarge: function() { countdownContainer.classList.remove('small'); countdownContainer.classList.add('large'); },
      makeTimerSmall: function() { countdownContainer.classList.remove('large'); countdownContainer.classList.add('small'); }
    };

    async function checkEntertainmentModule() {
      try { const r = await fetch(window.API_URL + '/api/entertaining/state'); return r.ok; }
      catch(e) { return false; }
    }

    async function scanAllVideos() {
      try {
        const res  = await fetch(window.API_URL + '/api/entertaining/videos');
        const data = await res.json();
        availableVideos = data.videos || [];
        videoDurations.clear();
        for (const v of availableVideos) {
          try { videoDurations.set(v.path, await getVideoDuration(v.path)); }
          catch(e) {}
        }
      } catch(e) {}
    }

    function getVideoDuration(path) {
      return new Promise((res, rej) => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.addEventListener('loadedmetadata', () => { res(v.duration); v.remove(); });
        v.addEventListener('error', () => { rej(new Error('failed')); v.remove(); });
        v.src = path;
      });
    }

    function findBestVideoCombination(targetTime, videos) {
      if (!videos.length) return [];
      const dp = Array(Math.ceil(targetTime)+1).fill(0);
      const sel = Array(Math.ceil(targetTime)+1).fill(null).map(()=>[]);
      for (const vid of videos) {
        const d = Math.floor(vid.duration);
        for (let t = Math.ceil(targetTime); t >= d; t--) {
          if (dp[t-d]+d > dp[t]) { dp[t]=dp[t-d]+d; sel[t]=[...sel[t-d],vid]; }
        }
      }
      return sel[Math.ceil(targetTime)] || [];
    }

    function createPlaylist(dur) {
      const START=5, END=10, TRANS=4;
      let avail = dur - START - END;
      const vids = Array.from(videoDurations.entries()).map(([p,d])=>({ path:p, duration:d, name: (availableVideos.find(v=>v.path===p)||{}).name||p }));
      const pl=[], used=new Set();
      while (avail>0 && used.size<vids.length) {
        const unused = vids.filter(v=>!used.has(v.path));
        if (!unused.length) break;
        const combo = findBestVideoCombination(avail, unused);
        if (!combo.length) {
          const sh = unused.reduce((m,v)=>v.duration<m.duration?v:m);
          if (sh.duration<=avail) { pl.push(sh); used.add(sh.path); avail-=(sh.duration+TRANS); }
          else break;
        } else {
          for (const v of combo) { pl.push(v); used.add(v.path); avail-=TRANS; }
          avail -= combo.reduce((s,v)=>s+v.duration,0);
        }
      }
      return pl;
    }

    async function playVideo(path) {
      return new Promise(resolve => {
        videoEl.src = path;
        videoEl.classList.remove('hidden','fade-out');
        videoEl.currentTime = 0;
        let fadeOutDone = false;
        videoEl.play().catch(()=>resolve());
        setTimeout(()=>videoEl.classList.add('fade-in'), 50);
        const chk = setInterval(()=>{
          if (videoEl.paused||videoEl.ended) { clearInterval(chk); return; }
          const rem = videoEl.duration - videoEl.currentTime;
          if (rem<=2 && !fadeOutDone) {
            fadeOutDone=true;
            videoEl.classList.remove('fade-in');
            videoEl.classList.add('fade-out');
            window.entertainmentTimerControl.makeTimerLarge();
          }
        },100);
        videoEl.onended = ()=>{ clearInterval(chk); videoEl.classList.remove('fade-in','fade-out'); resolve(); };
        videoEl.onerror = ()=>{ clearInterval(chk); resolve(); };
      });
    }

    async function stopVideo() {
      return new Promise(resolve=>{
        videoEl.classList.remove('fade-in');
        videoEl.classList.add('fade-out');
        setTimeout(()=>{ videoEl.pause(); videoEl.src=''; videoEl.classList.remove('fade-out'); videoEl.classList.add('hidden'); resolve(); },2000);
      });
    }

    async function entertainmentLoop(timer) {
      if (!entertainmentEnabled||!timer.isRunning) { if(entertainmentActive) await resetEnt(); return; }
      if (!entertainmentActive && timer.remaining===timer.duration) {
        entertainmentActive=true; timerStartTime=Date.now();
        currentPlaylist=createPlaylist(timer.duration); currentVideoIndex=0;
        window.entertainmentTimerControl.makeTimerLarge(); return;
      }
      const elapsed=Math.floor((Date.now()-timerStartTime)/1000);
      if (entertainmentActive&&elapsed>=5&&currentVideoIndex===0&&videoEl.classList.contains('hidden')) {
        if (currentPlaylist.length>0) await playNextVideo(); return;
      }
      if (entertainmentActive&&!videoTransitioning&&videoEl.ended&&currentVideoIndex<currentPlaylist.length) {
        if (timer.remaining>15) await playNextVideo();
      }
      if (entertainmentActive&&timer.remaining<=10&&timer.remaining>0) {
        if (!videoEl.classList.contains('hidden')&&!videoEl.classList.contains('fade-out')) await stopVideo();
        window.entertainmentTimerControl.makeTimerLarge();
      }
    }

    async function playNextVideo() {
      if (currentVideoIndex>=currentPlaylist.length||videoTransitioning) return;
      videoTransitioning=true;
      const vid=currentPlaylist[currentVideoIndex];
      if (!videoEl.classList.contains('hidden')) { await stopVideo(); await new Promise(r=>setTimeout(r,2000)); }
      currentVideoIndex++;
      window.entertainmentTimerControl.makeTimerSmall();
      await playVideo(vid.path);
      videoTransitioning=false;
    }

    async function resetEnt() {
      entertainmentActive=false; currentPlaylist=[]; currentVideoIndex=0; videoTransitioning=false;
      if (!videoEl.classList.contains('hidden')) await stopVideo();
      window.entertainmentTimerControl.makeTimerLarge();
    }

    function updateTimerDisplay(timer) {
      const mins=Math.floor(timer.remaining/60), secs=timer.remaining%60;
      timeEl.textContent=(mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;
      barEl.style.width=((timer.remaining/timer.duration)*100)+'%';
      if (timer.endTime&&!timer.isPaused) {
        const d=new Date(timer.endTime);
        endEl.textContent=texts[currentLang].around+' '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()+' '+texts[currentLang].clock;
      } else if (timer.isPaused) { endEl.textContent='Paused'; }
      else { endEl.textContent='Around --:--'; }
    }

    async function updateCountdown() {
      try {
        const res   = await fetch(window.API_URL + '/api/timer/public');
        const timer = await res.json();
        currentLang = timer.language||'en';
        const changed = !currentTimerState||currentTimerState.isRunning!==timer.isRunning||currentTimerState.isPaused!==timer.isPaused||Math.abs(currentTimerState.remaining-timer.remaining)>2;
        currentTimerState=timer;
        if (entertainmentEnabled) await entertainmentLoop(timer);
        if (timer.isRunning&&timer.remaining>0) {
          updateTimerDisplay(timer);
          timeEl.classList.remove('hidden'); endEl.classList.remove('hidden');
          messageEl.classList.add('hidden'); skippedEl.classList.add('hidden');
          messageShownAt=null; skippedShownAt=null;
        } else {
          timeEl.classList.add('hidden'); barEl.style.width='0%';
          if (timer.wasSkipped) {
            messageEl.textContent=texts[currentLang].starting; messageEl.classList.remove('hidden');
            if (!messageShownAt) messageShownAt=Date.now();
            if (Date.now()-messageShownAt>5000) messageEl.classList.add('stop-pulse'); else messageEl.classList.remove('stop-pulse');
            skippedEl.textContent=texts[currentLang].skipped; skippedEl.classList.remove('hidden');
            if (!skippedShownAt) skippedShownAt=Date.now();
            if (Date.now()-skippedShownAt>5000) skippedEl.classList.add('stop-pulse'); else skippedEl.classList.remove('stop-pulse');
            endEl.classList.add('hidden');
          } else {
            messageEl.textContent=texts[currentLang].starting; messageEl.classList.remove('hidden');
            if (!messageShownAt) messageShownAt=Date.now();
            if (Date.now()-messageShownAt>5000) messageEl.classList.add('stop-pulse'); else messageEl.classList.remove('stop-pulse');
            skippedEl.classList.add('hidden'); endEl.classList.add('hidden');
          }
        }
        if (changed&&lastTimerRemaining>timer.remaining+5&&entertainmentEnabled) await resetEnt();
        lastTimerRemaining=timer.remaining;
      } catch(e) { console.error('[COUNTDOWN] error:', e); }
    }

    async function checkEntertainmentStatus() {
      try {
        const res=await fetch(window.API_URL+'/api/entertaining/state');
        if (res.ok) {
          const data=await res.json();
          const was=entertainmentEnabled;
          entertainmentEnabled=data.enabled||false;
          if (entertainmentEnabled&&!was) await scanAllVideos();
          if (!entertainmentEnabled&&was) await resetEnt();
        }
      } catch(e) { entertainmentEnabled=false; }
    }

    async function initialize() {
      const hasEnt=await checkEntertainmentModule();
      if (hasEnt) { await scanAllVideos(); setInterval(checkEntertainmentStatus,1000); }
      setInterval(updateCountdown, 100);
      updateCountdown();
    }

    initialize();
  </script>
</body>
