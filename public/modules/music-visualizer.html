<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Visualizer</title>
  
  <script type="application/json" id="module-config">
  {
    "id": "music-visualizer",
    "name": "Music Visualizer",
    "type": "Addon",
    "priority": 0,
    "hasControllerUI": false,
    "hasOverlay": true,
    "overlayUrl": "/modules/music-visualizer.html",
    "dependencies": []
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: transparent;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
      overflow: hidden;
    }
    
    .now-playing {
      position: relative;
      transform: translateX(-150%);
      opacity: 0;
      min-width: 600px;
      max-width: 1200px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
      padding: 3px;
      border-radius: 25px;
      background: linear-gradient(
        90deg,
        #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3,
        #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000
      );
      background-size: 300% 100%;
      animation: rainbow-flow 15s linear infinite;
    }
    
    @keyframes rainbow-flow {
      0%   { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }
    
    .now-playing-inner {
      background: rgba(42,42,42,0.95);
      border-radius: 22px;
      padding: 30px;
      display: flex;
      align-items: center;
      gap: 35px;
      width: 100%;
    }
    
    .now-playing.slide-in {
      animation: slideInFromLeft 1s ease-out forwards, rainbow-flow 15s linear infinite;
    }
    
    .now-playing.slide-out {
      animation: slideOutToLeft 1s ease-in forwards, rainbow-flow 15s linear infinite;
    }
    
    @keyframes slideInFromLeft {
      0%   { transform: translateX(-150%); opacity: 0; }
      100% { transform: translateX(0);     opacity: 1; }
    }
    
    @keyframes slideOutToLeft {
      0%   { transform: translateX(0);     opacity: 1; }
      100% { transform: translateX(-150%); opacity: 0; }
    }
    
    .album-cover {
      width: 200px;
      height: 200px;
      border-radius: 15px;
      background: linear-gradient(135deg, #1DB954, #1ed760);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    
    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .track-info { flex: 1; min-width: 0; }
    
    .track-name {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.3;
      word-wrap: break-word;
    }
    
    .artist-name {
      font-size: 28px;
      opacity: 0.85;
      line-height: 1.3;
      word-wrap: break-word;
    }
    
    .music-logo {
      font-size: 18px;
      opacity: 0.5;
      margin-top: 15px;
    }
    
    .hidden { display: none !important; }
    
    #audio-player, #audio-player-next { display: none; }
  </style>
</head>
<body>
  <audio id="audio-player" preload="auto" playsinline></audio>
  <audio id="audio-player-next" preload="auto" playsinline></audio>

  <div class="now-playing" id="nowPlaying">
    <div class="now-playing-inner">
      <div class="album-cover" id="albumCover">🎵</div>
      <div class="track-info">
        <div class="track-name" id="trackName">No music playing</div>
        <div class="artist-name" id="artistName">Start music to see info</div>
        <div class="music-logo" id="musicSource">🎵 Music</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    
    const nowPlaying  = document.getElementById('nowPlaying');
    const albumCover  = document.getElementById('albumCover');
    const trackName   = document.getElementById('trackName');
    const artistName  = document.getElementById('artistName');
    const musicSource = document.getElementById('musicSource');
    const audioPlayer     = document.getElementById('audio-player');
    const audioPlayerNext = document.getElementById('audio-player-next');
    
    let activeModule = null;
    let isVisible    = false;
    let hideTimeout  = null;
    
    // Playlist state
    let currentSong      = null;
    let nextSong         = null;
    let currentVolume    = 50;
    let crossfadeStarted = false;
    let isPlaying        = false;
    const CROSSFADE_TIME = 5;
    
    // Spotify state
    let lastSpotifyTrackId = null;
    
    // Audio context
    let audioContext = null;
    
    function initAudioContext() {
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
      }
    }
    
    function resumeAudioContext() {
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }
    
    // Wake lock
    async function keepAlive() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch(e) {}
      
      setInterval(() => { resumeAudioContext(); }, 15000);
      initAudioContext();
    }
    
    keepAlive();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { keepAlive(); resumeAudioContext(); }
    });
    
    // ── Visualizer show/hide ──────────────────────────────────────────
    
    function showVisualizer() {
      if (isVisible) {
        // Reset timer
        if (hideTimeout) clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideVisualizer, 10000);
        return;
      }
      isVisible = true;
      nowPlaying.classList.remove('slide-out', 'hidden');
      nowPlaying.classList.add('slide-in');
      if (hideTimeout) clearTimeout(hideTimeout);
      hideTimeout = setTimeout(hideVisualizer, 10000);
    }
    
    function hideVisualizer() {
      if (!isVisible) return;
      isVisible = false;
      nowPlaying.classList.remove('slide-in');
      nowPlaying.classList.add('slide-out');
      setTimeout(() => {
        if (!isVisible) nowPlaying.classList.add('hidden');
      }, 1000);
    }
    
    function updateDisplay(title, artist, coverUrl, source) {
      trackName.textContent  = title  || 'Unknown Title';
      artistName.textContent = artist || 'Unknown Artist';
      musicSource.textContent = source || '🎵 Music';
      
      if (coverUrl) {
        albumCover.innerHTML = '<img src="' + coverUrl + '" alt="Cover">';
      } else {
        albumCover.innerHTML = '🎵';
      }
    }
    
    // ── Module detection ──────────────────────────────────────────────
    
    async function checkMusicModules() {
      try {
        const res  = await fetch(API_URL + '/api/modules/list');
        const data = await res.json();
        
        const hasPlaylist = data.modules.some(m => m.id === 'playlist');
        const hasSpotify  = data.modules.some(m => m.id === 'spotify');
        
        if (hasPlaylist) {
          activeModule = 'playlist';
          musicSource.textContent = '🎵 Playlist';
          startPlaylistMode();
        } else if (hasSpotify) {
          activeModule = 'spotify';
          musicSource.textContent = '🎵 Spotify';
          startSpotifyMode();
        } else {
          console.warn('[VISUALIZER] No music module found');
        }
      } catch(e) {
        console.error('[VISUALIZER] Module check error:', e);
      }
    }
    
    // ── SPOTIFY MODE ──────────────────────────────────────────────────
    
    function startSpotifyMode() {
      console.log('[VISUALIZER] Spotify mode');
      updateSpotify();
      setInterval(updateSpotify, 2000);
    }
    
    async function updateSpotify() {
      try {
        const res  = await fetch(API_URL + '/api/spotify/public');
        const data = await res.json();
        
        if (!data.connected || !data.isPlaying || !data.track) {
          return; // nichts anzeigen wenn Spotify nicht spielt
        }
        
        const trackId = data.track.id;
        
        // Nur anzeigen wenn sich der Track geändert hat
        if (trackId !== lastSpotifyTrackId) {
          lastSpotifyTrackId = trackId;
          
          updateDisplay(
            data.track.title,
            data.track.artist,
            data.track.coverUrl,
            '🎵 Spotify'
          );
          
          showVisualizer();
          console.log('[VISUALIZER] Spotify track changed:', data.track.title);
        }
      } catch(e) {
        console.error('[VISUALIZER] Spotify update error:', e);
      }
    }
    
    // ── PLAYLIST MODE ─────────────────────────────────────────────────
    
    function startPlaylistMode() {
      console.log('[VISUALIZER] Playlist mode');
      initAudioContext();
      setupAudioListeners();
      updatePlaylist();
      setInterval(updatePlaylist, 500);
    }
    
    async function updatePlaylist() {
      try {
        const res  = await fetch(API_URL + '/api/playlist/public');
        const data = await res.json();
        
        resumeAudioContext();
        
        if (data.volume !== currentVolume) {
          currentVolume = data.volume;
          audioPlayer.volume = currentVolume / 100;
        }
        
        if (data.isPlaying !== isPlaying) {
          isPlaying = data.isPlaying;
          if (isPlaying) {
            resumeAudioContext();
            audioPlayer.play().catch(() => {
              document.addEventListener('click', () => audioPlayer.play(), { once: true });
            });
          } else {
            audioPlayer.pause();
            audioPlayerNext.pause();
          }
        }
        
        if (data.currentSong && data.currentSong !== currentSong) {
          currentSong      = data.currentSong;
          crossfadeStarted = false;
          
          audioPlayer.src = '/music/' + currentSong;
          audioPlayer.volume = currentVolume / 100;
          audioPlayer.load();
          
          if (isPlaying) {
            resumeAudioContext();
            audioPlayer.play().catch(e => console.error('[PLAYLIST] Play error:', e));
          }
          
          if (data.metadata) {
            updateDisplay(data.metadata.title, data.metadata.artist, data.metadata.coverUrl, '🎵 Playlist');
          } else {
            updateDisplay(currentSong.replace(/\.(mp3|wav|ogg)$/i, ''), 'Local Music', null, '🎵 Playlist');
          }
          
          showVisualizer();
        }
      } catch(e) {
        console.error('[PLAYLIST] Update error:', e);
      }
    }
    
    function setupAudioListeners() {
      audioPlayer.addEventListener('timeupdate', async () => {
        if (!isPlaying) return;
        const timeLeft = audioPlayer.duration - audioPlayer.currentTime;
        if (timeLeft <= CROSSFADE_TIME && timeLeft > 0 && !crossfadeStarted) {
          crossfadeStarted = true;
          try {
            const res  = await fetch(API_URL + '/api/playlist/next-song', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (data.currentSong) {
              nextSong = data.currentSong;
              audioPlayerNext.src    = '/music/' + nextSong;
              audioPlayerNext.volume = 0;
              audioPlayerNext.currentTime = 0;
              audioPlayerNext.load();
              resumeAudioContext();
              audioPlayerNext.play().catch(e => console.error(e));
              
              const fadeInterval = setInterval(() => {
                const progress = 1 - ((audioPlayer.duration - audioPlayer.currentTime) / CROSSFADE_TIME);
                audioPlayer.volume     = Math.max(0, (currentVolume / 100) * (1 - progress));
                audioPlayerNext.volume = Math.min(currentVolume / 100, (currentVolume / 100) * progress);
                if (progress >= 1) clearInterval(fadeInterval);
              }, 50);
            }
          } catch(e) { console.error('[PLAYLIST] Crossfade error:', e); }
        }
      });
      
      audioPlayer.addEventListener('ended', () => {
        if (nextSong) {
          audioPlayer.src = audioPlayerNext.src;
          audioPlayer.volume = currentVolume / 100;
          audioPlayer.currentTime = audioPlayerNext.currentTime;
          audioPlayerNext.src = '';
          currentSong = nextSong;
          nextSong = null;
          crossfadeStarted = false;
          if (isPlaying) { resumeAudioContext(); audioPlayer.play().catch(e => console.error(e)); }
        } else {
          fetch(API_URL + '/api/playlist/next-song', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
            .then(() => updatePlaylist())
            .catch(e => console.error(e));
        }
      });
    }
    
    // Start
    checkMusicModules();
  </script>
</body>
</html>
